# nginx serves the built SPA and reverse-proxies the API.
#
# The security headers below are the document half of the policy. The backend's
# SecurityHeadersFilter covers responses it serves (JSON and file downloads), but a CSP
# delivered on an API response does not constrain the HTML document that loaded the scripts —
# only the header on the document does. Both halves are required; keep them in sync with
# backend/src/main/java/com/backend/filter/SecurityHeadersFilter.java.

# HSTS must only be sent when the request actually arrived over HTTPS. This container listens
# on plain HTTP and expects TLS to terminate upstream, so the decision follows
# X-Forwarded-Proto. Pinning a developer's browser to a scheme their local stack does not
# serve would lock them out of http://localhost.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend's request cap (spring.servlet.multipart.max-request-size=10MB) so nginx's
    # compiled-in 1m default does not reject an upload the backend would otherwise accept. Keep
    # this in sync with that property.
    client_max_body_size 10m;

    # Common proxy headers for every location below that talks to the backend. Unlike add_header,
    # proxy_set_header IS inherited by a location that defines none of its own, so declaring these
    # once here (rather than repeating them in each location) is safe as long as no location below
    # needs a different set — none currently does.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # JS/CSS bundles and JSON API responses compress well; images and fonts already are, so they
    # are left out of gzip_types rather than spending CPU for no size benefit.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Uploaded attachments are served by the backend through /files/, which enforces
    # authorization. Nothing here should ever be able to render a user-supplied document.
    location / {
        try_files $uri $uri/ /index.html;

        # ------------------------------------------------------------------
        # Document-level security headers.
        #
        # add_header inside a location replaces (does not merge with) any inherited set, so
        # the full list is repeated in every location that needs it.
        #
        # The script-src hash covers the one inline <script> in public/index.html: the
        # anti-FOUC theme bootstrap that adds .dark to <html> before first paint. A hash keeps
        # the policy strict where 'unsafe-inline' would disable script CSP entirely.
        #
        # The hash is over the MINIFIED build output, so editing that snippet invalidates it.
        # Regenerate after any change to the inline script:
        #   npm run build
        #   python3 - <<'PY'
        #   import re,hashlib,base64
        #   h=open('build/index.html',encoding='utf-8').read()
        #   for m in re.finditer(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', h, re.S):
        #       print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
        #   PY
        # Failure mode if it drifts is cosmetic, not fatal: the theme bootstrap is blocked and
        # a dark-mode user sees one light frame before React mounts. The app still loads,
        # because the application bundle is an external file, not inlined.
        #
        # style-src/font-src additionally admit Google Fonts: index.css and Aurora.css load their
        # type via @import url('https://fonts.googleapis.com/...'), which itself pulls the font
        # files from fonts.gstatic.com. Without both origins the whole app falls back to system
        # fonts in this containerised deployment (npm start has no CSP, so the gap is invisible
        # there). Self-hosting the fonts would let font-src stay 'self'-only, but that means
        # committing binary font files, which this fix does not do.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GHUZTiK1EI8kynuLvMCp7uMgVgrjVVROGRRCU66p4Kc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # 0 disables the legacy, deprecated XSS auditor; the CSP is the real protection.
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # index.html must never be cached: it carries the content-hashed bundle references, so a
    # stale copy pins a browser to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GHUZTiK1EI8kynuLvMCp7uMgVgrjVVROGRRCU66p4Kc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # Bundles are content-hashed by the build, so they are safe to cache immutably.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    location /api/ {
        proxy_pass http://backend:8080;

        # The notification stream is Server-Sent Events: no response buffering, and a read
        # timeout above the backend's app.sse.timeout-ms (300s) so nginx does not cut the
        # stream before the server closes it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
    }

    # Attachment downloads. The backend requires a valid JWT and project access for these;
    # they are not public static files.
    location /files/ {
        proxy_pass http://backend:8080;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    # No /uploads/ block: nothing in the backend maps that path. It is only the on-disk
    # directory name (app.storage.upload-dir); the public route is /files/.
}

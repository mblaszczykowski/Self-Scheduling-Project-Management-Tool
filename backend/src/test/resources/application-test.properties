# Test profile. The datasource is supplied by Testcontainers via @ServiceConnection, so no
# database coordinates appear here.

jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-security
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.issuer=flowlink
jwt.audience=flowlink-web

app.cookie.secure=false
app.cookie.same-site=Lax
app.cors.allowed-origins=http://localhost:3000
app.frontend.base-url=http://localhost:3000
app.mail.enabled=false
app.storage.upload-dir=target/test-uploads

# Flyway owns the schema here exactly as it does in production, and Hibernate validates the
# entity model against it — which is the point of running these tests against real PostgreSQL.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.com.backend=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

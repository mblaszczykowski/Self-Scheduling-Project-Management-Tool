# Test Profile Configuration
spring.application.name=flowlink-test

# JWT Configuration for Tests
jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-security
jwt.access-token-expiration=15
jwt.refresh-token-expiration=7

# Cookie Security Settings (disabled for testing)
app.cookie.secure=false
app.cookie.same-site=Lax

# CORS Configuration
app.cors.allowed-origin=http://localhost:3000

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA Settings for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable connection pool for tests
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=target/test-uploads

# Logging - minimal for tests
logging.level.com.backend=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

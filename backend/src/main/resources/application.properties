spring.application.name=flowlink

# JWT Configuration - Use environment variable for production
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-should-be-at-least-32-characters-long-for-security}
jwt.access-token-expiration=15
jwt.refresh-token-expiration=7

# CORS Configuration
app.cors.allowed-origin=http://localhost:3000

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/flowlink
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# Security Headers (optional but recommended)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.com.backend=INFO
logging.level.com.backend.filter=DEBUG
logging.level.com.backend.services.AuthService=INFO
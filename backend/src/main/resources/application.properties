spring.application.name=flowlink

# JWT Configuration
# JWT_SECRET must be set - application will fail to start without it
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15
jwt.refresh-token-expiration=7

# Cookie Security Settings
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS Configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:3000}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flowlink}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Flyway manages the schema in production (see application-prod.properties). In dev the
# convenience of Hibernate auto-DDL is kept, so Flyway is off by default here.
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Batch write statements (helps large cascade deletes / bulk saves round-trip fewer times).
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool
# Adjust pool size based on expected concurrent users
# Formula: connections = (core_count * 2) + effective_spindle_count
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Optimization Defaults
app.optimization.default-alpha=${OPT_ALPHA:0.8}
app.optimization.default-beta=${OPT_BETA:0.2}

# Rate Limiting
rate-limit.max-login-attempts=${RATE_LIMIT_LOGIN:5}
rate-limit.max-register-attempts=${RATE_LIMIT_REGISTER:3}
rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:900000}

# App Properties
app.pagination.default-size=50
app.pagination.max-size=100
app.sse.timeout-ms=300000

# Email / SMTP Configuration (Brevo)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.backend=INFO
logging.level.com.backend.filter=INFO

app.mail.enabled=${APP_MAIL_ENABLED:false}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:noreply@example.com}
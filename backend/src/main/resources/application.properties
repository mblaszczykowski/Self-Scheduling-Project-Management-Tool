spring.application.name=flowlink

# ---------------------------------------------------------------------------
# JWT
# JWT_SECRET is mandatory (min 32 chars) - the application will not start without it.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.clock-skew=30s
jwt.issuer=flowlink
jwt.audience=flowlink-web

# ---------------------------------------------------------------------------
# Cookies
# Secure by default; local HTTP development must opt out explicitly.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Absolute lifetime of a login regardless of refresh-token rotation.
app.session.absolute-max-days=${SESSION_MAX_DAYS:30}

# ---------------------------------------------------------------------------
# CORS / frontend
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:3000}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Trust X-Forwarded-* only from the reverse proxy, so the real client address reaches the
# rate limiter and cannot be spoofed by a client sending its own header.
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.internal-proxies=${INTERNAL_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]{1}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}

# ---------------------------------------------------------------------------
# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flowlink}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway owns the schema everywhere - dev, CI and production run the same DDL, and Hibernate
# only verifies that the entity model matches it. Previously Flyway was disabled by default and
# no deployment activated the profile that enabled it, so the migrations never ran at all.
spring.flyway.enabled=true
# Adopts Flyway on a database that predates it (built by auto-DDL) by baselining at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Batches write statements (helps large cascade deletes and bulk updates round-trip fewer times;
# inserts cannot batch because every entity uses IDENTITY generation).
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP. Rule of thumb: (core_count * 2) + effective_spindle_count.
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# ---------------------------------------------------------------------------
# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# ---------------------------------------------------------------------------
# Pagination / streaming
app.pagination.default-size=50
app.pagination.max-size=100
app.sse.timeout-ms=300000
app.sse.max-emitters-per-user=4

# ---------------------------------------------------------------------------
# Schedule optimization
app.optimization.default-alpha=${OPT_ALPHA:0.8}
app.optimization.default-beta=${OPT_BETA:0.2}
app.optimization.min-horizon-days=30
app.optimization.max-horizon-days=3650
app.optimization.dependency-weight=5.0
app.optimization.horizon-start-max-past-days=30
app.optimization.horizon-start-max-future-days=365

# ---------------------------------------------------------------------------
# Rate limiting (per client address per window, except login which is per address + account)
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:900000}
app.rate-limit.login=${RATE_LIMIT_LOGIN:5}
app.rate-limit.register=${RATE_LIMIT_REGISTER:3}
app.rate-limit.write=${RATE_LIMIT_WRITE:300}
app.rate-limit.optimize=${RATE_LIMIT_OPTIMIZE:30}
app.rate-limit.search=${RATE_LIMIT_SEARCH:120}
app.rate-limit.invitation=${RATE_LIMIT_INVITATION:50}

# ---------------------------------------------------------------------------
# Mail
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@example.com}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Operations
# Health only, on the main port; nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Two scheduled jobs (token cleanup, rate-limit eviction) must not queue behind each other.
spring.task.scheduling.pool.size=2

logging.level.com.backend=INFO

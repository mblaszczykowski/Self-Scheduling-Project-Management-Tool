spring.application.name=flowlink

# JWT Configuration
# JWT_SECRET must be set - application will fail to start without it
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15
jwt.refresh-token-expiration=7

# Cookie Security Settings
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Lax

# CORS Configuration
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flowlink}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# HikariCP Connection Pool
# Adjust pool size based on expected concurrent users
# Formula: connections = (core_count * 2) + effective_spindle_count
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Logging
logging.level.com.backend=INFO
logging.level.com.backend.filter=DEBUG
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# Schema is managed by Flyway (src/main/resources/db/migration). Hibernate only VALIDATES
# that the entity model matches the migrated schema; it never mutates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Baseline an already-populated database (adopting Flyway on an existing schema) at V1;
# fresh databases simply run V1 and onward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=false

# Secure cookies are mandatory over HTTPS in production.
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Quieter logging in production.
logging.level.com.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/flowlink
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: flowlink-dev-secret-key-minimum-32-chars
      CORS_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Java 21 specifically: the build targets 21, and Mockito's bytecode instrumentation
      # fails on JVMs it has no support for, so a newer JDK breaks the mock-based tests.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The integration tests start a real postgres:16-alpine through Testcontainers. The
      # ubuntu-latest runner image ships a running Docker daemon, so no service container or
      # setup action is needed - this step only fails fast with a clear message if that ever
      # stops being true.
      - name: Verify Docker is available for Testcontainers
        run: docker info > /dev/null

      - name: Run tests
        run: mvn test -B

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Check production and test TypeScript, including modules outside the build graph.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit

      - name: Lint
        run: npm run lint

      # The API types are generated from docs/openapi.json, which the backend's
      # OpenApiContractTest keeps in step with the controllers. Regenerating here proves the
      # committed types match that spec, so a renamed DTO field cannot reach the client silently.
      - name: Check generated API types are current
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/types/api.generated.ts

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build

      - name: Verify documentation links
        run: python3 ../scripts/verify-docs.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A signing key was committed in plaintext once in this repository's history, so the guard
      # against it happening again is mechanical rather than a review habit.
      #
      # This scans the checked-out tree, not the git history. The two historical findings cannot
      # be removed without rewriting published history, and a permanently red check is a check
      # nobody reads. To audit history on demand:
      #   docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v
      - name: Scan working tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --verbose --no-banner

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure isolated smoke stack
        run: |
          python3 - <<'PYENV'
          import os, secrets
          from pathlib import Path
          settings = {
              'JWT_SECRET': secrets.token_urlsafe(48),
              'POSTGRES_PASSWORD': secrets.token_urlsafe(24),
              'POSTGRES_DB': 'flowlink_smoke',
              'POSTGRES_USER': 'flowlink_smoke',
              'HTTP_PORT': '8088',
              'RATE_LIMIT_LOGIN': '50',
              'COOKIE_SECURE': 'false',
              'CORS_ORIGIN': 'http://localhost:8088',
              'FRONTEND_BASE_URL': 'http://localhost:8088',
          }
          Path(os.environ['RUNNER_TEMP'], 'flowlink-ci.env').write_text(
              ''.join(f'{key}={value}\n' for key, value in settings.items()))
          PYENV

      - name: Build and start production images
        run: docker compose --env-file "$RUNNER_TEMP/flowlink-ci.env" -p flowlink-ci up --build --wait --wait-timeout 180

      - name: Seed isolated smoke database
        run: docker compose --env-file "$RUNNER_TEMP/flowlink-ci.env" -p flowlink-ci exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < backend/scripts/db/demo-seed.sql

      - name: Test production app in Chromium
        working-directory: frontend
        env:
          FLOWLINK_BASE_URL: http://localhost:8088
        run: npm run test:e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/flowlink-ci.env" -p flowlink-ci logs --no-color --tail=100

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop isolated smoke stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/flowlink-ci.env" -p flowlink-ci down -v
